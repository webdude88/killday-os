# Kill-Day OS boot menu. Shared by the ISO and the USB layout.
search --no-floppy --set=root --file /.disk/killday-boot
set timeout=10
set default=0
insmod all_video
insmod gfxterm
insmod png
loadfont /boot/grub/killday/mono-14.pf2
loadfont /boot/grub/killday/mono-16.pf2
loadfont /boot/grub/killday/mono-18.pf2
set gfxmode=1024x768,auto
terminal_output gfxterm
set theme=/boot/grub/killday/theme.txt

set live="boot=live components noeject username=survivor user-fullname=Survivor hostname=killday locales=en_US.UTF-8 keyboard-layouts=us"
set persist="persistence persistence-encryption=luks persistence-label=KILLDAY_PERSIST"

menuentry "Normal" {
    linux /live/vmlinuz $live $persist quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /live/initrd.img
}
menuentry "Safe graphics" {
    linux /live/vmlinuz $live $persist nomodeset
    initrd /live/initrd.img
}
menuentry "Persistence on (show boot text)" {
    linux /live/vmlinuz $live $persist
    initrd /live/initrd.img
}
menuentry "Persistence off (nothing is saved)" {
    linux /live/vmlinuz $live quiet splash loglevel=3
    initrd /live/initrd.img
}
menuentry "Load to RAM (needs 8 GB or more)" {
    linux /live/vmlinuz $live toram quiet splash loglevel=3
    initrd /live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Memory test (turn Secure Boot off first)" {
        chainloader /live/memtest86+x64.efi
    }
else
    menuentry "Memory test" {
        linux16 /live/memtest86+x64.bin
    }
fi
