<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader - The Kill-Day Almanac</title><link rel="icon" href="img/favicon.ico"><link rel="stylesheet" href="css/almanac.css"></head>
<body><main><h1 id="title"></h1><div id="warn"></div>
<p class="hint">If the guide does not appear below, <a id="open" href="#">open it directly</a>.</p>
<iframe id="reader" title="Document"></iframe></main>
<script src="js/common.js"></script>
<script>
(async function () {
  KD.header();
  await KD.load();
  const id = new URLSearchParams(location.search).get("id");
  const found = KD.allItems().find((item) => item.id === id);
  if (!found) { document.getElementById("title").textContent = "Corrupted? Still alive. That guide is not on this drive."; return; }
  document.title = `${found.title} - The Kill-Day Almanac`;
  document.getElementById("title").textContent = found.title;
  const text = KD.disclaimerText(found, found.module);
  if (text) document.getElementById("warn").innerHTML = `<div class="warning">${KD.esc(text)}</div>`;
  const src = `library/${found.path.split("/").map(encodeURIComponent).join("/")}`;
  document.getElementById("open").href = src;
  document.getElementById("reader").src = src + location.hash;
})();
</script></body></html>
