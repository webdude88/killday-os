<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module - The Kill-Day Almanac</title><link rel="icon" href="img/favicon.ico"><link rel="stylesheet" href="css/almanac.css"></head>
<body><main><h1 id="title"></h1><div id="warn"></div><p id="blurb" class="prose"></p><div id="items" class="tiles"></div></main>
<script src="js/common.js"></script>
<script>
(async function () {
  KD.header();
  await KD.load();
  const id = new URLSearchParams(location.search).get("id");
  const mod = KD.catalog.modules.find((m) => m.id === id);
  if (!mod) { document.getElementById("title").textContent = "Corrupted? Still alive. That module does not exist."; return; }
  document.title = `${mod.title} - The Kill-Day Almanac`;
  document.getElementById("title").textContent = mod.title;
  document.getElementById("blurb").textContent = mod.blurb;
  if (mod.disclaimer) document.getElementById("warn").innerHTML = `<div class="warning">${KD.esc(KD.catalog.disclaimers[mod.disclaimer])}</div>`;
  document.getElementById("items").innerHTML = mod.items.map((item) => {
    const present = KD.isInstalled(item);
    const open = present ? `href="${KD.itemLink(item)}"` : "";
    return `<a class="tile ${present ? "" : "missing"}" ${open}><h3>${KD.esc(item.title)}</h3>
      <p>${KD.esc(item.description || "")}</p>
      <span class="tag">${present ? "Installed" : "Not on this drive"}</span>
      ${(item.disclaimer || mod.disclaimer) && (item.disclaimer || mod.disclaimer) !== "general" ? '<span class="tag warn">Reference only</span>' : ""}</a>`;
  }).join("");
})();
</script></body></html>
